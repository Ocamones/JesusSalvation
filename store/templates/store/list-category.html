{% extends "./base.html" %}
{% load static %}

{% block content %}

<!-- ================= CATEGORY HEADER ================= -->
<div class="container-fluid py-5 bg-light">
    <div class="container text-center">
        <h1 >
            {{ category.name|capfirst }}
        </h1>
        <p class="text-muted">Check our best products</p>
    </div>
</div>

<!-- ================= PRODUCTS (ICE CREAM STYLE) ================= -->
<div class="container py-5">
    <div class="row">

        {% for product in products %}
        <div class="col-lg-3 col-md-4 col-sm-6 mb-4">

            <div class="product-item d-flex flex-column align-items-center text-center bg-light rounded py-4 px-3 shadow-sm">

                <!-- Price badge -->
                <div class="bg-primary py-2 px-3 rounded mb-3">
                    <h5 class="text-white mb-0">$ {{ product.price }}</h5>
                </div>

                <!-- Product image -->
                <div class="position-relative bg-primary rounded-circle mb-4 p-3"
                     style="width:150px;height:150px;">
                    <img src="{{ product.image.url }}"
                         class="rounded-circle w-100 h-100"
                         style="object-fit:cover;">
                </div>

                <!-- Product title -->
                <h5 class="font-weight-bold mb-3">
                    {{ product.title|capfirst }}
                </h5>

                <!-- Action -->
                <a href="{{ product.get_absolute_url }}"
                   class="btn btn-sm btn-secondary">
                    View Product
                </a>

            </div>

        </div>
        {% empty %}
        <div class="col-12 text-center">
            <p>No products available in this category.</p>
        </div>
        {% endfor %}

    </div>
</div>

{% endblock %}
